description: >
  Category-conditioned 5M SFT on sft-cat from a pretrained voxel checkpoint (init_from on the command line, e.g. the 5M world-crop pretrain outputs/run_20261105_013018_wc5m_pretrain_u_s1/last.pt on 60684456e598). The trainer extends the checkpoint's 507-token vocabulary to the 520 of voxels-cat 116e68927d45 (trainer.extend_vocab: the 13 class rows start as copies of BOS, so step 0 computes what the checkpoint did). Same recipe as houses32-sft-5m: 16k steps, lr 1e-4, dropout 0 (the pretraining value, T59), select=best on eval-cat.
extends: [base]
name: cat_sft_5m_pt
stage: sft
train: [sft-cat]
val: [eval-cat, eval-holdout]
tokenizer: 116e68927d45
steps: 16000
warmup: 200
lr: 1.0e-4
eval_every: 500
ckpt_every: 4000
dropout: 0.0
bench_n: 256
sample_tags: {src: curated, q: "4", size: "32", win: whole, cat: house}
