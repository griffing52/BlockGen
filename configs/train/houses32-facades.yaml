description: the facade kind on the pinned houses_32 train split, one sequence per face of every house (notes.md §55)
extends: [base]
name: houses32_facades_5m
stage: sft
kind: facades
tokenizer: a9546c1f2f94        # the per-face facade shard; the joint shard is newer and must not be picked up
train: [sft-houses32]
val: [eval-holdout]
steps: 8000
warmup: 200
eval_every: 500
ckpt_every: 2000
dropout: 0.1
max_seq_len: 2200
