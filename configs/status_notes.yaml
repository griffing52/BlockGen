# Hand-maintained facts for scripts/status_matrix.py, which generates docs/status.md.
#
# Everything the code can know (tiers, shards, presets, archs, configs, registry
# runs, rewards, protocol constants) is read from the repo. This file holds what
# it cannot: legacy tracks, T-numbers, best numbers, planned items, and the
# status of things that have no code. Rows are {option, status, where, number};
# `status` starts with one of the four legend words.
#
# Status legend (synthesis 2026-10-30):
#   used     implemented and exercised in a recorded run
#   unused   implemented, never run
#   planned  no code
#   stale    exists but superseded or broken
#
# Rows with a `key` are merged with a machine-read fact of the same key; the
# machine text is appended to `number`. No em dashes anywhere in this file.

# 1. Data sources. `key` is the manifest `source` value; the generator appends
# the per-tier row counts from data/minecraft/corpus/tiers/*.json.
data_sources:
  - option: worldcrop (MAP archive.org world saves, cropped)
    key: worldcrop
    status: used
    where: blockgen/data/worldcrop/run.py; blockgen/corpus/manifest.py build
    number: 927,427 manifest rows (manifest summary, 2026-10-31; 926k at T55); pretraining only, no licence
  - option: grabcraft (category-labelled)
    key: grabcraft
    status: used
    where: blockgen/data/grabcraft_dataset.py; enters through the 32/48 caches
    number: ""
  - option: 3dcraft (CraftAssist houses with build order)
    key: 3dcraft
    status: used
    where: blockgen/utils/corpora.py
    number: build-order traces loaded, consumed by nothing
  - option: text2mc .h5
    key: text2mc
    status: used
    where: blockgen/utils/corpora.py (current vocab); blockgen/curation/corpus.py (legacy, ground-stripped)
    number: ""
  - option: text2mc_schem (28k raw .schem)
    key: text2mc_schem
    status: used
    where: blockgen/utils/schem.py
    number: 21 in all_32, 117 in houses_48
  - option: templates (1.21.1 jigsaw NBT)
    key: templates
    status: used
    where: blockgen/corpus/templates.py
    number: 1,007 pieces (T56); internal source only (Mojang assets), never a release or a reference (docs/pipeline.md section 3 tier table)
  - option: tfrecord crawl (PlanetMinecraft)
    status: unused
    where: blockgen/data/tfrecord_dataset.py
    number: not in any tier
  - option: legacy raw .schematic
    status: unused
    where: blockgen/data/build_cache.py
    number: drifted crawl
  - option: LEGO corpora (OMR, StableText2Brick, LDraw, Shadow)
    status: unused (for training)
    where: data/lego/; blockgen/eval/bench/lego.py
    number: lego_void_20 split; interior-blindness replication only (T34)
  - option: MCGS chunk sample, CurseForge release tier, Hermitcraft, Dream-Cubed, code-generated vanilla structures
    status: planned
    where: research.md section F
    number: shards.from_structures exists, so code-generated structures are unblocked

