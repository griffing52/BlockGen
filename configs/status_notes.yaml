# 8. Post-training ladder. `module` decides planned (missing) vs unused/used;
# `evidence` names the machine rule: bon (a BoN report outside a smoke run),
# posttrain_runs (a registry row with stage posttrain).
posttrain_rungs:
  - option: 1. Best-of-N with a verifier
    module: blockgen/posttrain/bon.py
    evidence: bon
    where: python -m blockgen.posttrain.bon --run <dir> --n N --k K --reward <name>
    number: writes an arm npz with report.method=bon and trained_on_signals; facade face_solidity k=4 871 at T=1.0, 483 at T=0.7 = on the facade ceiling 493 (T70, T77); voxel lcc26 k=4 340 at n=256, still the best voxel arm (T71, T74)
  - option: 2. Rejection-sampling fine-tuning
    module: blockgen/posttrain/rft.py
    evidence: posttrain_runs
    where: python -m blockgen.posttrain.rft --run <dir> --reward <name> --n N --keep-frac F; then the printed blockgen.train command
    number: "facade RFT + select=reward + T=0.7 = 553 at n=399, ceiling 493 (T73); voxel RFT step 500 395, step 4000 (select=reward) 359 at T=1.0, 478 at T=0.7 (T71, T73, T74)"
  - option: 3. GRPO with verifiable rewards
    module: blockgen/posttrain/grpo.py
    where: docs/pipeline.md section 7
    number: needs per-sequence log-probs and a KL reference; after the arch registry
  - option: 4. DPO / SimPO on 2AFC or reward-ranked pairs
    module: blockgen/posttrain/dpo.py
    where: libs/MinecraftACE/dpo/train_dpo_acce.py is the only template
    number: 617 lab compares exist and are off-policy for every trainer model
  - option: 5. Merge (WARP) and distil
    module: blockgen/posttrain/merge.py
    where: docs/pipeline.md section 7
    number: ""
posttrain_extra:
