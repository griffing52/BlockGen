# 3. Tiers: per-tier notes appended to the machine-read row.
tiers:
  anneal: {note: "the pretraining tier of T58 to T60 (5M only)"}
  pretrain-all: {note: "the M2 20M target that never ran; shards ready since 2026-10-15"}
  pretrain-clean: {note: "soft-filtering ablation partner of pretrain-all; never run"}
  sft-houses32: {note: "the SFT target and scratch baseline; pinned train split"}
  eval-holdout: {note: "val+test of the pinned split; 736 of 798 fit the 8,200 context"}
  vanilla: {note: "negative set for the gate; a tagged pretraining source"}
  templates: {note: "a source inside the pretrain tiers; standalone shard unused"}
  mixtures: {note: "tier:weight mixtures are implemented (config.py train_specs, data.py MixedBatches) and no config uses one"}

