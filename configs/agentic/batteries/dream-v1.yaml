# First dream pilot. classic-matched is the compute-matched no-dream control and
# dream-oracle the ceiling (train-split dreams, never ranked). Hold the dream spec
# and seed fixed across dream arms: the shared dream cache then gives every arm the
# SAME images, so differences are the loop, not the dream lottery.
name: dream_v1
description: dream loop pilot vs the compute-matched control and the oracle ceiling
prompts: {source: detailed, n: 12, seed: 0}     # tasks.load_prompts; n>=256 for leaderboard claims
budget: {usd: 8.0}                              # battery-level ledger cap
cache: read_write
recipes:
  - classic-matched
  - dream
  - dream-refine
  - dream-oracle
  - {dream: {as: dream_vdm, params.feedback: vdm}}    # inline override -> arm 'dream_vdm'
sweep:                                           # optional cartesian product over ONE base
  base: dream
  grid: {params.max_iters: [1, 3], dreams: [[iso], [iso, interior, plan]]}
  max_arms: 8
