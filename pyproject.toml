[project]
name = "blockgen"
version = "0.1.0"
description = "Generative AI for Voxel and Brick Structures (such as Minecraft or Lego)"
authors = [
    { name="Griffin Galimi", email="emailgriffinnow@gmail.com" }
]
license = { text = "GNU General Public License v3.0" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "scipy>=1.7",    # connected-component labelling (blockgen/eval/novelty.py)
    "pyyaml>=5.1",   # experiment configs (configs/, blockgen/config.py)
]

[project.optional-dependencies]
gnn = [
    "torch>=2.1",
    "torch-geometric>=2.4",
]
render = [
    "pyrender>=0.1.45",   # textured offscreen rendering (blockgen/renderer/textured.py)
    "trimesh>=4.0",
    "PyOpenGL>=3.1",
    "pillow>=9.0",
]
agentic = [
    # Track E (blockgen/agentic/): LLM-written build programs. Only the provider
    # you actually use is needed -- the OpenAI client also drives Gemini through
    # its OpenAI-compatible endpoint, so `openai` alone covers both.
    "openai>=1.40",
    "python-dotenv>=1.0",  # reads the repo .env for API keys
    "pillow>=9.0",         # PNG encoding for image conditioning / visual critique
    "anthropic>=0.40",     # optional: --provider anthropic:…
    "google-genai>=1.0",   # optional: native Gemini client (else the compat endpoint)
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["blockgen"]

[tool.pytest.ini_options]
markers = [
    "slow: touches the real corpus, a GPU, or the renderer (deselect with -m 'not slow')",
]