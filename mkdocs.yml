site_name: BlockGen
site_description: Generative models and a validated benchmark for structured 3D block data (Minecraft first, LEGO next)
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.blocks.caption
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Workflow (train → evaluate → view): workflow.md
  - Architecture (code map): architecture.md
  - Data (sources to shards): data.md
  - World-crop corpus: worldcrop.md
  - Training pipeline: pipeline.md
  - Representations & tokenization: representations.md
  - Models (the tracks): models.md
  - Agentic generation (Track E): agentic.md
  - Agentic methods suite: agentic-suite.md
  - Block ontology: ontology.md
  - Pick-and-place (Track F): pick-and-place.md
  - MinecraftACE (LegoACE port): minecraftace.md
  - Labeling & captions: labeling.md
  - Experiments & outputs: experiments.md
  - Bring your own model: custom-model.md
  - Add a model, end to end: add-a-model.md
  - Status matrix: status.md
  - Reproducing a run (T18): reproduce-native.md
  - Evaluation suite: benchmark.md
  - BlockLab (local tool): lab.md
  - Scripts reference: scripts.md
  - Results (root results.md): results.md
  - Roadmap (research.md section I): roadmap.md
