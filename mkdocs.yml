site_name: BlockGen
site_description: Text-free generative models for structured 3D block data (Minecraft → LEGO → electronics)
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.blocks.caption
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture (code map): architecture.md
  - Data & curation: data-and-curation.md
  - Representations & tokenization: representations.md
  - Models (the three tracks): models.md
  - Agentic generation (Track E): agentic.md
  - Block ontology: ontology.md
  - Pick-and-place (Track F): pick-and-place.md
  - MinecraftACE (LegoACE port): minecraftace.md
  - Labeling & captions: labeling.md
  - Experiments & outputs: experiments.md
  - Bring your own model: custom-model.md
  - Reproducing a run (T18): reproduce-native.md
  - Evaluation suite: benchmark.md
  - BlockLab (local tool): lab.md
  - Results: results.md
  - Roadmap (LEGO / electronics): roadmap.md
